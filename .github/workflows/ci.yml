name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest moved to 26.04, which has no Python 3.8 build for
    # setup-python; 24.04 still has both versions the matrix tests.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q
